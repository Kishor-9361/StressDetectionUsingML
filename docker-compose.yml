version: '3.8'

services:
  stress-detection-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stress-detection-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=*
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
